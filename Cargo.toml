[package]
name = "claude-opus-4-7-search_longest-match-first_ocr_corrector_v2_6"
version = "2.6.0"
edition = "2024"

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon      = "1.12"
dashmap    = "6.0"
ahash      = "0.8"
fastbloom  = "0.17"
clap       = { version = "4.5", features = ["derive"] }
indicatif  = "0.18"
colored    = "3.1"
zstd       = "0.13"
rand       = "0.8.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
